ppremotece-android-application = { id = "ppremotece.android.application" }
ppremotece-android-library = { id = "ppremotece.android.library" }
ppremotece-android-library-compose = { id = "ppremotece.android.library.compose" }
ppremotece-jvm-library = { id = "ppremotece.jvm.library" }
ppremotece-android-feature = { id = "ppremotece.android.feature" }
ppremotece-lint = { id = "ppremotece.lint" }
